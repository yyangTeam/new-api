name: E2E Tests

on:
  # E2E is pre-existing-broken: the app does not render in headless chromium
  # (React never mounts — root stays empty, no console errors). global-setup
  # and networkidle were fixed (2309975d) but the render issue remains and
  # needs browser-devtools-level debugging. To avoid blocking dev pushes on
  # a known-broken suite, E2E runs only on pull requests, not on push to
  # dev. Re-add the push trigger once the headless render issue is resolved.
  pull_request:
    paths:
      - '.github/workflows/e2e-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/playwright.config.ts'
      - 'web/e2e/**'
      - 'web/src/**'

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
