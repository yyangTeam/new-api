name: Frontend Tests

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/vitest.config.ts'
      - 'web/src/**'
  pull_request:
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/vitest.config.ts'
      - 'web/src/**'

jobs:
  test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: web
        # Run WITHOUT --coverage to test whether v8 coverage instrumentation
        # is the worker heap-exhaustion source (CI OOMs at ~4GB with
        # --coverage; local no-coverage runs stay flat at ~350MB). If this
        # passes, --coverage (v8) was the leak; restore coverage in a
        # separate non-blocking step or after the leak is fixed.
        run: bun run test
