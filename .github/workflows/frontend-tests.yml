name: Frontend Tests

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/vitest.config.ts'
      - 'web/src/**'
  pull_request:
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/vitest.config.ts'
      - 'web/src/**'

jobs:
  test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Pin Node to 22 (LTS). The happy-dom/jsdom suite heap-exhausts at
      # ~4GB on the runner's DEFAULT Node 24 (V8 13.x retains DOM/window
      # state across test files in a long-lived worker); Node 22's V8 does
      # not reproduce the leak (verified locally: node-v22.16.0 stays flat
      # at ~350MB across the full suite). `bun run` spawns `node` from PATH
      # for the vitest bin, so setup-node's Node 22 is what runs the tests.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: web
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: web/coverage/
          retention-days: 7
