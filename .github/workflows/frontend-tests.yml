name: Frontend Tests

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/vitest.config.ts'
      - 'web/src/**'
  pull_request:
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/vitest.config.ts'
      - 'web/src/**'

jobs:
  test:
    name: shard 7 diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run shard 7 (single worker + heap log, diagnostic)
        working-directory: web
        # Diagnostic: shard 7 OOMs at ~4GB on CI (other 7 shards pass).
        # Single worker + --logHeapUsage + verbose so the per-test heap
        # progression is streamed (not lost on worker crash), to identify
        # which file leaks ~4GB. Temporary — restore the 8-shard matrix
        # after the pathological file is fixed/skipped.
        run: bunx vitest run --shard 7/8 --maxWorkers=1 --logHeapUsage --reporter=verbose
