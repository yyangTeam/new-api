name: Frontend Tests

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/vitest.config.ts'
      - 'web/src/**'
  pull_request:
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/vitest.config.ts'
      - 'web/src/**'

jobs:
  test:
    name: shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run tests (shard ${{ matrix.shard }}/8)
        working-directory: web
        # The suite heap-leaks on the CI runner (DOM/window retention across
        # files in a long-lived worker; not happy-dom/coverage/Node-version
        # specific). Sharding across 8 jobs keeps each worker to ~17 files so
        # the retained heap stays well under the ~2GB V8 limit. No --coverage
        # here: per-shard coverage is partial and would trip the threshold;
        # restore merged coverage + threshold once sharding is confirmed to
        # avoid the OOM.
        run: bunx vitest run --shard ${{ matrix.shard }}/8
