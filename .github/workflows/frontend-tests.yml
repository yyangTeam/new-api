name: Frontend Tests

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/vitest.config.ts'
      - 'web/src/**'
  pull_request:
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'web/bun.lock'
      - 'web/package.json'
      - 'web/vitest.config.ts'
      - 'web/src/**'

jobs:
  test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: web
        # --maxWorkers=1 + 4GB heap: the happy-dom suite leaks retained DOM
        # state across test files in a long-lived worker; under multi-worker GC
        # contention one worker exhausts its ~2GB heap and crashes. A single
        # worker has no GC contention (heap stays flat) and 4GB gives headroom.
        run: NODE_OPTIONS=--max-old-space-size=4096 bun run test:coverage -- --maxWorkers=1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: web/coverage/
          retention-days: 7
